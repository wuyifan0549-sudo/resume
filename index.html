<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#1f4e79">
<title>电子简历</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f4e79'/%3E%3Cpath d='M20 18h17l9 9v19a2 2 0 0 1-2 2H20a2 2 0 0 1-2-2V20a2 2 0 0 1 2-2z' fill='%23fff'/%3E%3Cpath d='M25 33h14M25 39h10' stroke='%231f4e79' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f2f4f7; --card:#fff; --ink:#17212c; --ink-2:#384656; --muted:#6a7786; --line:#e3e8ee;
  --accent:#1f4e79; --accent-2:#2c679f; --accent-soft:#e8eef4;
  --gold:#94650a; --gold-soft:#fbf0d4; --green:#1b7449; --green-soft:#e0f2e8; --blue:#1d5ba6; --blue-soft:#e4edf9;
  --grey-soft:#eef1f4; --warn:#a35a00; --warn-soft:#fdf0de;
  --radius:16px; --shadow:0 1px 2px rgba(16,32,52,.05),0 6px 22px rgba(16,32,52,.06);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
a{color:var(--accent-2);text-decoration:none}
img{display:block}
svg{flex:none}
[hidden]{display:none!important}

/* ---------- gate ---------- */
#gate{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 16px calc(28px + env(safe-area-inset-bottom));
  background:radial-gradient(900px 520px at 12% -8%,rgba(92,150,210,.55) 0%,transparent 62%),linear-gradient(160deg,#14365a 0%,#1f4e79 58%,#275d90 100%)}
#gate.wait .gate-card,#gate.wait .gate-foot{visibility:hidden}
.gate-card{width:100%;max-width:372px;background:#fff;border-radius:22px;padding:34px 22px 22px;box-shadow:0 24px 70px rgba(6,20,38,.38);text-align:center}
.gate-icon{width:58px;height:58px;margin:0 auto 14px;border-radius:17px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.gate-icon svg{width:28px;height:28px}
.gate-card h1{margin:0;font-size:22px;letter-spacing:.12em}
.gate-sub{margin:6px 0 22px;color:var(--muted);font-size:13px;letter-spacing:.02em}
#gate-form{display:flex;gap:8px}
#pw{flex:1;min-width:0;height:48px;border:1.5px solid var(--line);border-radius:13px;padding:0 14px;font:16px var(--font);color:var(--ink);background:#f8fafc;outline:none;transition:border-color .15s,box-shadow .15s,background .15s;-webkit-appearance:none;appearance:none}
#pw:focus{border-color:var(--accent-2);box-shadow:0 0 0 4px rgba(44,103,159,.13);background:#fff}
#go{height:48px;padding:0 20px;border-radius:13px;background:var(--accent);color:#fff;font-weight:600;letter-spacing:.12em;white-space:nowrap}
#go:active{background:#173d61}
#go:disabled{opacity:.6}
.gate-hint{margin:14px 0 0;color:var(--muted);font-size:13px}
.gate-err{min-height:21px;margin:6px 0 0;color:#c0392b;font-size:13px}
.gate-foot{margin:18px 0 0;color:rgba(255,255,255,.66);font-size:12px;letter-spacing:.04em}
.shake{animation:shake .36s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;background:rgba(242,244,247,.88);-webkit-backdrop-filter:saturate(1.8) blur(14px);backdrop-filter:saturate(1.8) blur(14px);border-bottom:1px solid rgba(23,33,44,.06)}
.topbar-in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 16px}
.brand{margin-right:auto;font-weight:700;font-size:15px;white-space:nowrap;letter-spacing:.06em}
.brand small{margin-left:6px;font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0}
.seg{display:flex;background:#e3e8ee;border-radius:11px;padding:3px}
.seg button{height:32px;padding:0 13px;border-radius:9px;font-size:14px;color:var(--ink-2);white-space:nowrap;transition:background .15s,color .15s}
.seg button[aria-selected=true]{background:#fff;color:var(--accent);font-weight:600;box-shadow:0 1px 3px rgba(16,32,52,.1)}
.seg .n{margin-left:3px;font-size:11.5px;color:var(--muted);font-weight:400}
.pdf-btn{display:flex;align-items:center;gap:4px;height:34px;padding:0 11px;border-radius:10px;background:#fff;border:1px solid var(--line);color:var(--accent);font-size:13px;font-weight:600;white-space:nowrap}
.pdf-btn svg{width:15px;height:15px}
.pdf-btn:disabled{opacity:.6}
@media (max-width:430px){.brand small{display:none}.seg button{padding:0 10px}}
@media (max-width:370px){.brand{display:none}.topbar-in{justify-content:space-between}}

main{max-width:880px;margin:0 auto;padding:12px 16px 8px}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:20px;color:#fff;padding:20px 18px 16px;box-shadow:var(--shadow);
  background:radial-gradient(420px 260px at 105% -20%,rgba(255,255,255,.14) 0%,transparent 70%),linear-gradient(150deg,#163b60 0%,#1f4e79 58%,#2b6197 100%)}
.hero-in{display:flex;gap:16px;align-items:center}
.photo{width:86px;height:124px;flex:none;object-fit:cover;border-radius:12px;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.55);opacity:0;transition:opacity .3s}
.photo.ok{opacity:1}
.hero h1{margin:0;font-size:27px;line-height:1.25;letter-spacing:.14em}
.tagline{margin:5px 0 0;font-size:14.5px;line-height:1.5;font-weight:600;color:#ffe2a0}
.sub{margin:4px 0 0;font-size:13px;line-height:1.55;color:rgba(255,255,255,.88)}
.facts{margin:2px 0 0;font-size:12.5px;color:rgba(255,255,255,.7)}
.contact{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}
.ct{display:inline-flex;align-items:center;gap:6px;height:33px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:13px;white-space:nowrap}
.ct:active{background:rgba(255,255,255,.22)}
.ct svg{width:15px;height:15px;opacity:.9}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
.stat{display:block;width:100%;background:#fff;border-radius:15px;padding:12px 14px 11px;box-shadow:var(--shadow);position:relative}
button.stat:active{background:#f7f9fb}
.stat b{font-size:25px;line-height:1.2;color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.stat span{margin-left:2px;font-size:13px;color:var(--accent);font-weight:600}
.stat em{display:block;margin-top:3px;font-style:normal;font-size:12.5px;line-height:1.45;color:var(--muted)}
.stat .go{position:absolute;right:10px;top:12px;color:#b3bdc8}
.stat .go svg{width:16px;height:16px}
@media (min-width:660px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* ---------- section cards ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 16px 15px;margin:12px 0;scroll-margin-top:62px}
.card h2{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:17px;line-height:1.4;letter-spacing:.04em}
.card h2::before{content:"";width:4px;height:17px;border-radius:2px;background:var(--accent);flex:none}
.card h2 .cnt{margin-left:auto;font-size:12.5px;font-weight:400;color:var(--muted);letter-spacing:0}
.entry{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 10px;margin-top:14px}
.card h2+.entry{margin-top:6px}
.entry h3{margin:0;font-size:15px;line-height:1.5;font-weight:650;color:var(--ink)}
.meta{font-size:12.5px;color:var(--muted);white-space:nowrap}
.role{margin:2px 0 0;font-size:13px;line-height:1.6;color:var(--muted)}
ul.bl{margin:6px 0 0;padding:0;list-style:none}
ul.bl li{position:relative;margin:6px 0;padding-left:14px;color:var(--ink-2)}
ul.bl li::before{content:"";position:absolute;left:2px;top:.74em;width:5px;height:5px;border-radius:50%;background:var(--accent-2);opacity:.6}
.lb{font-weight:650;color:var(--ink)}
.hl li{padding-left:0!important}
.hl li::before{display:none}
.hl .pill{display:inline-block;margin-right:7px;padding:0 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:650;line-height:22px;vertical-align:1px}
.note{margin:14px 0 0;padding:9px 12px;border-radius:11px;background:var(--grey-soft);font-size:13px;line-height:1.65;color:var(--muted)}
.note button,.linkbtn{color:var(--accent-2);font-weight:600}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;background:var(--grey-soft);color:var(--ink-2);font-size:12px;font-weight:600;white-space:nowrap;line-height:1}
.badge.gold{background:var(--gold-soft);color:var(--gold)}
.badge.blue{background:var(--blue-soft);color:var(--blue)}
.badge.green{background:var(--green-soft);color:var(--green)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 7px;border-radius:6px;border:1px solid var(--line);color:var(--muted);font-size:12px;white-space:nowrap;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.chip{display:inline-flex;align-items:center;gap:4px;min-height:28px;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12.5px;line-height:1.4}
.chip.plain{background:var(--grey-soft);color:var(--ink-2)}
button.chip:active{filter:brightness(.95)}
.chip svg{width:13px;height:13px}
.evc{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 9px;border-radius:8px;border:1px solid #cddbea;background:#f5f8fc;color:var(--accent);font-size:12px;font-weight:600;white-space:nowrap}
.evc svg{width:13px;height:13px}
.evc:active{background:#e8eef4}
.evrow{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.links button{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 12px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600}
.links svg{width:14px;height:14px}
.muted{color:var(--muted);font-size:13.5px;line-height:1.7;margin:0}
.nw{white-space:nowrap}
.sep{color:#9aa6b2}
.hero .sep{color:rgba(255,255,255,.5)}
.dt{font-weight:400;color:var(--muted);font-size:13.5px;white-space:nowrap}

/* ---------- evidence ---------- */
.jump{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.jump button{height:32px;padding:0 13px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600}
.sum{margin:-2px 0 4px;font-size:13px;line-height:1.6;color:var(--muted)}
.grp{display:flex;align-items:center;gap:8px;margin:16px 0 2px;font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.06em}
.grp::after{content:"";flex:1;height:1px;background:var(--line)}
.item{border-top:1px solid var(--line)}
.grp+.item,.sum+.item,h2+.item{border-top:0}
.item-main{display:flex;gap:12px;width:100%;padding:12px 0;align-items:flex-start;text-align:left}
button.item-main:active{background:#f7f9fb}
.thumb{position:relative;flex:none;width:62px;height:84px;border-radius:9px;overflow:hidden;background:#eef2f6;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .25s}
.thumb img.ok{opacity:1}
.thumb .pg{position:absolute;right:3px;bottom:3px;padding:0 4px;border-radius:4px;background:rgba(10,20,30,.62);color:#fff;font-size:10px;line-height:16px;font-style:normal}
.thumb.none{display:flex;align-items:center;justify-content:center;color:#a7b1bc;background:#f5f7f9;border-style:dashed}
.thumb.none svg{width:22px;height:22px}
.ib{flex:1;min-width:0}
.ib .t{display:block;font-size:14.5px;line-height:1.5;font-weight:600;color:var(--ink)}
.ib .m{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.ib .m2{display:block;margin-top:5px;font-size:12px;line-height:1.6;color:var(--muted);overflow-wrap:break-word}
.ib .m2 strong{color:var(--ink-2)}
.ib .miss{display:inline-block;margin-top:6px;font-size:12px;color:var(--warn)}
.item-main .go{flex:none;align-self:center;color:#b6c0cb}
.item-main .go svg{width:17px;height:17px}
.item-links{margin:-6px 0 0;padding:0 0 12px 74px;font-size:12.5px;overflow-wrap:anywhere}

/* ---------- footer ---------- */
.foot{max-width:880px;margin:0 auto;padding:6px 20px calc(30px + env(safe-area-inset-bottom));text-align:center;color:var(--muted);font-size:12px;line-height:1.75}
.foot button{color:var(--accent-2);font-size:12px;text-decoration:underline}

/* ---------- viewer ---------- */
#viewer{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;background:#0b1016;color:#fff}
.v-top{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 12px 8px 16px}
.v-title{flex:1;min-width:0;font-size:14px;line-height:1.45;color:rgba(255,255,255,.92);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.v-close{flex:none;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center}
.v-close svg{width:20px;height:20px}
.v-note{margin:0 16px 6px;padding:7px 10px;border-radius:9px;background:rgba(255,200,90,.14);color:#ffd88a;font-size:12.5px;line-height:1.5}
.v-stage{position:relative;flex:1;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-user-select:none;user-select:none}
#v-img{max-width:none;max-height:none;background:#fff;transform-origin:50% 50%;will-change:transform;transition:transform .2s ease;-webkit-user-drag:none;user-select:none;pointer-events:none}
.v-spin{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border:3px solid rgba(255,255,255,.22);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.v-bottom{display:flex;align-items:center;gap:10px;padding:8px 12px calc(12px + env(safe-area-inset-bottom))}
.v-nav{flex:none;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center}
.v-nav svg{width:22px;height:22px}
.v-nav:disabled{opacity:.25}
.v-cap{flex:1;min-width:0;text-align:center;font-size:13px;line-height:1.5;color:rgba(255,255,255,.82)}
.v-cap small{display:block;font-size:11.5px;color:rgba(255,255,255,.5)}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));z-index:200;transform:translate(-50%,8px);max-width:min(88vw,420px);padding:10px 16px;border-radius:13px;background:rgba(18,26,36,.94);color:#fff;font-size:13.5px;line-height:1.6;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="gate" class="wait">
  <div class="gate-card">
    <div class="gate-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
    <h1>电子简历</h1>
    <p class="gate-sub">简历 · 项目经历 · 专利论文 · 获奖证书</p>
    <form id="gate-form" autocomplete="off" novalidate>
      <input id="pw" type="text" name="access" placeholder="请输入访问密码" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="访问密码">
      <button type="submit" id="go">进入</button>
    </form>
    <p class="gate-hint">访问密码为简历上的中文姓名</p>
    <p class="gate-err" id="err" role="alert"></p>
  </div>
  <p class="gate-foot">本页面仅供招聘方查阅，请勿转发</p>
</div>
<div id="app" hidden></div>
<div id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="v-title">
  <div class="v-top">
    <div class="v-title" id="v-title"></div>
    <button class="v-close" id="v-close" type="button" aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <p class="v-note" id="v-note" hidden></p>
  <div class="v-stage" id="v-stage"><img id="v-img" alt="证明材料" draggable="false"><div class="v-spin" id="v-spin"></div></div>
  <div class="v-bottom">
    <button class="v-nav" id="v-prev" type="button" aria-label="上一页"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
    <div class="v-cap"><span id="v-cap"></span><small id="v-page"></small></div>
    <button class="v-nav" id="v-next" type="button" aria-label="下一页"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
  </div>
</div>

<script>
(function () {
  'use strict';
  var CFG = window.CFG;
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var te = new TextEncoder(), td = new TextDecoder();
  var unb64 = function (s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
  var tob64 = function (u) { var s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); };
  var subtle = window.crypto && window.crypto.subtle;
  var KEY = null, DATA = null;

  var gate = $('#gate'), form = $('#gate-form'), pw = $('#pw'), goBtn = $('#go'), err = $('#err');
  var showErr = function (m) { err.textContent = m; };
  var busy = function (on) { goBtn.disabled = on; goBtn.textContent = on ? '验证中…' : '进入'; };

  function unwrap(password) {
    var norm = password.normalize('NFKC').replace(/\s+/g, '').toLowerCase();
    return subtle.importKey('raw', te.encode(norm), 'PBKDF2', false, ['deriveKey']).then(function (base) {
      return subtle.deriveKey({ name: 'PBKDF2', salt: unb64(CFG.salt), iterations: CFG.iter, hash: 'SHA-256' },
        base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    }).then(function (kek) {
      var i = 0;
      function next() {
        if (i >= CFG.keys.length) return null;
        var k = CFG.keys[i++];
        return subtle.decrypt({ name: 'AES-GCM', iv: unb64(k.i) }, kek, unb64(k.w))
          .then(function (raw) { return new Uint8Array(raw); }, next);
      }
      return next();
    });
  }
  function decrypt(iv, ct) {
    return subtle.decrypt({ name: 'AES-GCM', iv: iv }, KEY, ct).then(function (b) { return new Uint8Array(b); });
  }
  function start(raw) {
    return subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']).then(function (k) {
      KEY = k;
      return decrypt(unb64(CFG.data.i), unb64(CFG.data.c));
    }).then(function (pt) {
      DATA = JSON.parse(td.decode(pt));
      try { sessionStorage.setItem('rk', tob64(raw)); } catch (e) {}
      render();
    });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!subtle || goBtn.disabled) return;
    var v = pw.value;
    if (!v.trim()) { showErr('请输入访问密码'); return; }
    busy(true); showErr('');
    unwrap(v).then(function (raw) {
      if (!raw) {
        busy(false); showErr('密码不正确，请输入简历上的中文姓名');
        form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
        return;
      }
      return start(raw);
    }).catch(function (ex) { busy(false); showErr('打开失败，请刷新页面后重试'); if (window.console) console.error(ex); });
  });

  (function init() {
    if (!subtle || !window.TextEncoder) {
      gate.classList.remove('wait');
      showErr('当前浏览器无法打开：请确认网址以 https 开头，或换用系统浏览器');
      goBtn.disabled = true;
      return;
    }
    var saved = null;
    try { saved = sessionStorage.getItem('rk'); } catch (e) {}
    if (!saved) { gate.classList.remove('wait'); return; }
    start(unb64(saved)).catch(function () {
      try { sessionStorage.removeItem('rk'); } catch (e) {}
      gate.classList.remove('wait');
    });
  })();

  /* ---------- encrypted assets ---------- */
  var cache = {};
  function asset(id, type) {
    if (!cache[id]) {
      cache[id] = fetch('a/' + id + '.bin').then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.arrayBuffer();
      }).then(function (buf) {
        var u = new Uint8Array(buf);
        return decrypt(u.subarray(0, 12), u.subarray(12));
      }).then(function (pt) {
        return URL.createObjectURL(new Blob([pt], { type: type || 'image/jpeg' }));
      });
      cache[id].catch(function () { delete cache[id]; });
    }
    return cache[id];
  }
  function loadImg(img) {
    if (img.getAttribute('data-st')) return;
    img.setAttribute('data-st', '1');
    asset(img.getAttribute('data-a')).then(function (u) {
      img.onload = function () { img.classList.add('ok'); };
      img.src = u;
    }).catch(function () { img.removeAttribute('data-st'); });
  }
  var io = ('IntersectionObserver' in window) ? new IntersectionObserver(function (es) {
    es.forEach(function (e) { if (e.isIntersecting) { io.unobserve(e.target); loadImg(e.target); } });
  }, { rootMargin: '400px 0px' }) : null;

  /* ---------- page ---------- */
  var curTab = 'resume';
  function render() {
    document.title = DATA.title;
    var app = $('#app');
    app.innerHTML = DATA.html;
    gate.parentNode.removeChild(gate);
    app.hidden = false;
    $$('img[data-a]', app).forEach(function (img) {
      if (img.hasAttribute('data-eager') || !io) loadImg(img); else io.observe(img);
    });
    var initial = /^#evidence/.test(location.hash) ? 'evidence' : 'resume';
    history.replaceState({ tab: initial }, '', '#' + initial);
    setTab(initial, null, false);
  }
  function setTab(name, target, push) {
    if (name !== curTab) {
      curTab = name;
      $$('[data-tab]').forEach(function (b) { b.setAttribute('aria-selected', String(b.getAttribute('data-tab') === name)); });
      $('#tab-resume').hidden = name !== 'resume';
      $('#tab-evidence').hidden = name !== 'evidence';
      if (push) history.pushState({ tab: name }, '', '#' + name);
      if (!target) window.scrollTo(0, 0);
    }
    if (target) {
      var el = document.getElementById(target);
      if (el) setTimeout(function () { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 40);
    }
  }
  window.addEventListener('popstate', function (e) {
    var s = e.state || { tab: 'resume' };
    if (!viewer.hidden && !s.v) closeViewer(true);
    if (s.tab && s.tab !== curTab) setTab(s.tab, null, false);
  });

  var toastTimer;
  function toast(msg, ms) {
    var t = $('#toast');
    t.textContent = msg; t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('on'); }, ms || 2600);
  }
  function copy(text) {
    var fallback = function () {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta); return ok;
    };
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, fallback);
    }
    return Promise.resolve(fallback());
  }
  function downloadPdf(btn) {
    if (/MicroMessenger/i.test(navigator.userAgent)) {
      toast('微信内无法下载文件：请点右上角「···」选择「在浏览器打开」，再点 PDF', 5200);
      return;
    }
    var old = btn.innerHTML;
    btn.disabled = true; btn.textContent = '准备中…';
    asset(DATA.pdf.id, 'application/pdf').then(function (u) {
      var a = document.createElement('a');
      a.href = u; a.download = DATA.pdf.name;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }).catch(function () { toast('下载失败，请稍后重试'); }).then(function () {
      btn.disabled = false; btn.innerHTML = old;
    });
  }

  document.addEventListener('click', function (e) {
    if (!DATA) return;
    var t = e.target.closest('[data-ev],[data-goto],[data-copy],[data-tab],#pdf-btn,#lock');
    if (!t) return;
    if (t.hasAttribute('data-ev')) { e.preventDefault(); openViewer(t.getAttribute('data-ev')); }
    else if (t.hasAttribute('data-goto')) { e.preventDefault(); setTab('evidence', t.getAttribute('data-goto'), curTab !== 'evidence'); }
    else if (t.hasAttribute('data-tab')) { setTab(t.getAttribute('data-tab'), null, true); }
    else if (t.hasAttribute('data-copy')) {
      var v = t.getAttribute('data-copy');
      copy(v).then(function (ok) { toast(ok ? '已复制：' + v : '复制失败，请长按手动复制'); });
    }
    else if (t.id === 'pdf-btn') downloadPdf(t);
    else if (t.id === 'lock') { try { sessionStorage.removeItem('rk'); } catch (x) {} location.replace(location.pathname); }
  });

  /* ---------- viewer ---------- */
  var viewer = $('#viewer'), stage = $('#v-stage'), vimg = $('#v-img'), spin = $('#v-spin');
  var V = { id: null, i: 0, s: 1, x: 0, y: 0, k: 1, tok: 0 };
  function page() { return DATA.ev[V.id].pages[V.i]; }
  function openViewer(id) {
    var ev = DATA.ev[id];
    if (!ev || !ev.pages.length) { toast(ev && ev.note ? ev.note : '暂无证明材料'); return; }
    V.id = id;
    viewer.hidden = false;
    document.body.classList.add('noscroll');
    history.pushState({ tab: curTab, v: id }, '', location.hash);
    show(0);
  }
  function closeViewer(fromPop) {
    if (viewer.hidden) return;
    viewer.hidden = true;
    document.body.classList.remove('noscroll');
    V.tok++; vimg.removeAttribute('src');
    if (!fromPop && history.state && history.state.v) history.back();
  }
  function fit() {
    var p = page(), r = stage.getBoundingClientRect();
    var k = Math.min((r.width - 16) / p.w, (r.height - 16) / p.h);
    V.k = k;
    vimg.style.width = Math.max(1, Math.round(p.w * k)) + 'px';
    vimg.style.height = Math.max(1, Math.round(p.h * k)) + 'px';
  }
  function apply() { vimg.style.transform = 'translate3d(' + V.x + 'px,' + V.y + 'px,0) scale(' + V.s + ')'; }
  function reset() { V.s = 1; V.x = 0; V.y = 0; vimg.style.transition = ''; apply(); }
  function maxScale() { return Math.min(6, Math.max(2.5, 1.5 / V.k)); }
  function clamp() {
    var r = stage.getBoundingClientRect();
    var mx = Math.max(0, (vimg.offsetWidth * V.s - r.width) / 2 + 12);
    var my = Math.max(0, (vimg.offsetHeight * V.s - r.height) / 2 + 12);
    V.x = Math.max(-mx, Math.min(mx, V.x)); V.y = Math.max(-my, Math.min(my, V.y));
  }
  function rel(x, y) { var r = stage.getBoundingClientRect(); return { x: x - r.left - r.width / 2, y: y - r.top - r.height / 2 }; }
  function zoomAt(c, s2) {
    s2 = Math.max(1, Math.min(maxScale(), s2));
    V.x = c.x - s2 * (c.x - V.x) / V.s;
    V.y = c.y - s2 * (c.y - V.y) / V.s;
    V.s = s2;
    if (V.s <= 1.001) { V.s = 1; V.x = 0; V.y = 0; }
    clamp(); apply();
  }
  function show(i) {
    var ev = DATA.ev[V.id], n = ev.pages.length;
    V.i = Math.max(0, Math.min(n - 1, i));
    var p = page(), tok = ++V.tok, gotFull = false;
    $('#v-title').textContent = ev.title;
    $('#v-cap').textContent = p.c;
    $('#v-page').textContent = n > 1 ? (V.i + 1) + ' / ' + n : '';
    var note = $('#v-note'); note.textContent = ev.note || ''; note.hidden = !ev.note;
    $('#v-prev').hidden = $('#v-next').hidden = n < 2;
    $('#v-prev').disabled = V.i === 0; $('#v-next').disabled = V.i === n - 1;
    reset(); vimg.style.transition = 'none'; apply();
    vimg.removeAttribute('src'); spin.hidden = false;
    fit();
    asset(p.t).then(function (u) { if (tok === V.tok && !gotFull) vimg.src = u; }).catch(function () {});
    asset(p.f).then(function (u) {
      if (tok !== V.tok) return;
      gotFull = true; vimg.src = u; spin.hidden = true;
    }).catch(function () { if (tok === V.tok) { spin.hidden = true; toast('图片加载失败，请检查网络后重试'); } });
    if (V.i + 1 < n) asset(ev.pages[V.i + 1].f).catch(function () {});
  }
  $('#v-close').addEventListener('click', function () { closeViewer(false); });
  $('#v-prev').addEventListener('click', function () { show(V.i - 1); });
  $('#v-next').addEventListener('click', function () { show(V.i + 1); });
  document.addEventListener('keydown', function (e) {
    if (viewer.hidden) return;
    if (e.key === 'Escape') closeViewer(false);
    else if (e.key === 'ArrowLeft') show(V.i - 1);
    else if (e.key === 'ArrowRight') show(V.i + 1);
  });
  window.addEventListener('resize', function () { if (!viewer.hidden) { fit(); reset(); } });

  var pts = {}, npts = 0, pinch = null, drag = null, lastTap = 0;
  function ptList() { return Object.keys(pts).map(function (k) { return pts[k]; }); }
  stage.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (stage.setPointerCapture) { try { stage.setPointerCapture(e.pointerId); } catch (x) {} }
    if (!pts[e.pointerId]) npts++;
    pts[e.pointerId] = { x: e.clientX, y: e.clientY };
    vimg.style.transition = 'none';
    if (npts === 2) {
      var l = ptList(), a = l[0], b = l[1];
      pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, s: V.s, x: V.x, y: V.y, c: rel((a.x + b.x) / 2, (a.y + b.y) / 2) };
      drag = null;
    } else if (npts === 1) {
      drag = { x0: e.clientX, y0: e.clientY, x: V.x, y: V.y, t: Date.now(), moved: false };
    }
  });
  stage.addEventListener('pointermove', function (e) {
    if (!pts[e.pointerId]) return;
    pts[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (pinch && npts >= 2) {
      var l = ptList(), a = l[0], b = l[1];
      var s2 = Math.max(1, Math.min(maxScale(), pinch.s * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d));
      var c = rel((a.x + b.x) / 2, (a.y + b.y) / 2);
      V.x = c.x - s2 * (pinch.c.x - pinch.x) / pinch.s;
      V.y = c.y - s2 * (pinch.c.y - pinch.y) / pinch.s;
      V.s = s2; clamp(); apply();
    } else if (drag) {
      var dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
      if (Math.abs(dx) > 6 || Math.abs(dy) > 6) drag.moved = true;
      if (V.s > 1.001) { V.x = drag.x + dx; V.y = drag.y + dy; clamp(); apply(); }
      else if (drag.moved) { vimg.style.transform = 'translate3d(' + dx + 'px,' + Math.max(0, dy) * 0.6 + 'px,0)'; }
    }
  });
  function up(e) {
    if (!pts[e.pointerId]) return;
    delete pts[e.pointerId]; npts--;
    if (npts < 2) pinch = null;
    if (npts === 1) {
      var a = ptList()[0];
      drag = { x0: a.x, y0: a.y, x: V.x, y: V.y, t: 0, moved: true };
      return;
    }
    if (npts > 0) return;
    var d = drag; drag = null;
    vimg.style.transition = '';
    if (!d) { if (V.s <= 1.02) reset(); return; }
    var dx = e.clientX - d.x0, dy = e.clientY - d.y0;
    if (!d.moved && Date.now() - d.t < 300) { tap(e); return; }
    if (V.s <= 1.02) {
      var n = DATA.ev[V.id].pages.length;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.2 && ((dx < 0 && V.i < n - 1) || (dx > 0 && V.i > 0))) show(V.i + (dx < 0 ? 1 : -1));
      else if (dy > 110 && dy > Math.abs(dx) * 1.5) closeViewer(false);
      else reset();
    }
  }
  stage.addEventListener('pointerup', up);
  stage.addEventListener('pointercancel', up);
  function tap(e) {
    var now = Date.now();
    if (now - lastTap < 320) {
      lastTap = 0;
      vimg.style.transition = 'transform .22s ease';
      if (V.s > 1.02) reset(); else zoomAt(rel(e.clientX, e.clientY), Math.min(maxScale(), 2.6));
    } else lastTap = now;
  }
  stage.addEventListener('wheel', function (e) {
    e.preventDefault();
    vimg.style.transition = 'none';
    zoomAt(rel(e.clientX, e.clientY), V.s * (e.deltaY < 0 ? 1.15 : 1 / 1.15));
  }, { passive: false });
})();
</script>
